name: Build QuickNaira APK from zip
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ./*.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: src/QuickNaira-V2
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuickNaira-debug-apk
          path: src/QuickNaira-V2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
